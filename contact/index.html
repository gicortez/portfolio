<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../global.js" type="module"></script>
</head>
<body>

  <h1>Contact</h1>
    <form action="mailto:gicortez@ucsd.edu" method="POST" enctype="text/plain">
    <label>
      Your email:
      <input name="email" type="email" value="test@example.com">
    </label>

    <label>
      Subject:
      <input name="subject" value="Test subject">
    </label>

    <label>
      Message:
      <textarea name="body">Test message</textarea>
    </label>

    <button>Send</button>
  </form>
</body>
</html>
